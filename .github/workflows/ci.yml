name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  investor-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investor-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: investor-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KotlinProject
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon
