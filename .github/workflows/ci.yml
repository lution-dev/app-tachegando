name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  investor-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: investor-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: investor-hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KotlinProject
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon
